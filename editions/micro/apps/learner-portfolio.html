<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learner portfolio</title>
<style>
:root{--bg:#faf6f0;--card:#fff;--ink:#241f1a;--mut:#6f6557;--line:#e8dfd2;--accent:#a8622f;--ok:#6d8f6a;--radius:14px}
@media (prefers-color-scheme:dark){:root{--bg:#1b1815;--card:#241f1a;--ink:#f2ece4;--mut:#a99c8c;--line:#3b342b;--accent:#d9915c;--ok:#8fae8c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto;padding:28px 20px 40px}
h1{font-size:clamp(23px,4vw,31px);margin:0 0 4px;letter-spacing:-.015em}
h2{font-size:16px;margin:0 0 12px}
.sub{color:var(--mut);margin:0 0 22px;max-width:62ch}
.cols{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin:0 0 16px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:0 0 20px}
label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:4px}
select{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;max-width:100%}
canvas{width:100%;height:300px;display:block}
.lab{color:var(--mut);font-size:12.5px;text-transform:uppercase;letter-spacing:.06em}
.stat{font-size:28px;font-weight:650;letter-spacing:-.02em;margin:2px 0 0}
.tl{position:relative;padding-left:20px}
.tl:before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.item{position:relative;margin:0 0 20px}
.item:before{content:"";position:absolute;left:-19px;top:8px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
.item .who{font-size:12.5px;color:var(--mut);margin:4px 0 0}
.kind{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;background:rgba(168,98,47,.13);color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.kind.artifact{background:rgba(109,143,106,.16);color:var(--ok)}
.photo{width:100%;border-radius:10px;border:1px solid var(--line);margin:8px 0 0;display:block}
.empty{color:var(--mut);padding:18px;text-align:center;border:1px dashed var(--line);border-radius:var(--radius)}
.err{color:#b4585f;padding:12px;border:1px solid #b4585f33;border-radius:10px;background:#b4585f0d}
</style>
</head>
<body>
<main class="wrap">
<h1>Portfolio</h1>
<p class="sub">The work and the words, newest first, with the name of whoever wrote each one. The chart is a shape, not a score: it only shows the dimensions this pod has actually recorded.</p>
<div class="tools"><div><label for="who">Learner</label><select id="who"></select></div></div>
<div class="cols">
  <div>
    <section class="card"><h2 id="shapeTitle">Shape of the record</h2><canvas id="radar" aria-label="Signal dimensions"></canvas><p class="lab" id="cov"></p></section>
    <section class="card"><h2>Counted up</h2><div id="tiles"></div></section>
  </div>
  <section class="card"><h2>Timeline</h2><div id="tl" class="tl"></div></section>
</div>
<div id="err" class="err" role="alert" hidden></div>
</main>
<script>
var $ = function (s, r) { return (r || document).querySelector(s); };
function fail(e) { var b = $('#err'); b.hidden = false; b.textContent = e && e.message ? e.message : String(e); }
function note(m) { var n = document.createElement('p'); n.className = 'empty'; n.textContent = m; return n; }
function nameOf(p) { var n = [p.firstName, p.lastName].filter(Boolean).join(' '); return n || p.preferredName || p.id; }
function when(iso) { return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }); }
var LABELS = { gpa: 'GPA', attendance: 'Attendance', testScore: 'Tests', courseRigor: 'Rigor', assignCompletion: 'Follow-through', discipline: 'Conduct', extracurricular: 'Activities', selScore: 'Social-emotional', counselorVisits: 'Check-ins', trajectory: 'Trend', socioeconomic: 'Resources', homeStability: 'Home', ellStatus: 'English', specialEd: 'Services', peerConnected: 'Friendships' };

(async function () {
  try {
    await librea.ready();
    var r = await librea.people({ type: 'student', limit: 200 });
    var people = r.people || [];
    if (!people.length) { $('#tl').appendChild(note('No learners in this app’s scope yet.')); return; }
    people.sort(function (a, b) { return nameOf(a) < nameOf(b) ? -1 : 1; });
    people.forEach(function (p) { $('#who').appendChild(librea.el('option', { value: p.id, text: nameOf(p) })); });
    $('#who').addEventListener('change', function () { render($('#who').value); });
    await render(people[0].id);
    window.addEventListener('resize', function () { if (window.__last) draw(window.__last); });
  } catch (e) { fail(e); }
  librea.footer(document.querySelector('.wrap'));
})();

function draw(p) {
  var dims = p.dims || {};
  var keys = Object.keys(LABELS).filter(function (k) { return dims[k] != null; });
  if (!keys.length) { $('#radar').replaceWith(note('No recorded dimensions yet — the shape fills in as the pod writes things down.')); return; }
  librea.chart.radar($('#radar'), keys.map(function (k) { return LABELS[k]; }), keys.map(function (k) { return dims[k]; }), { max: 1 });
  $('#cov').textContent = keys.length + ' of 15 dimensions recorded' + (p.coverage != null ? ' · coverage ' + Math.round(p.coverage * 100) + '%' : '');
}

async function render(id) {
  $('#err').hidden = true;
  var res = await librea.person(id);
  var p = res.person || {};
  window.__last = p;
  $('#shapeTitle').textContent = nameOf(p);
  draw(p);

  var frags = res.fragments || [];
  var counts = {};
  frags.forEach(function (f) { counts[f.kind] = (counts[f.kind] || 0) + 1; });
  var tiles = $('#tiles');
  tiles.replaceChildren();
  [['Entries', frags.length], ['Pieces of work', counts.artifact || 0], ['Family voice', (counts.family || 0) + (counts.self || 0)], ['Age band', p.grade == null ? '—' : p.grade === 0 ? 'K' : p.grade === -1 ? 'PK' : String(p.grade)]]
    .forEach(function (row) {
      tiles.appendChild(librea.el('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', padding: '5px 0' } }, [
        librea.el('span', { class: 'lab', text: row[0] }), librea.el('span', { class: 'stat', style: { fontSize: '21px' }, text: String(row[1]) })
      ]));
    });

  var tl = $('#tl');
  tl.replaceChildren();
  if (!frags.length) { tl.appendChild(note('Nothing here yet. Start with one photo and one sentence about it.')); return; }
  frags.forEach(function (f) {
    var item = librea.el('div', { class: 'item' }, [
      librea.el('span', { class: 'kind ' + (f.kind === 'artifact' ? 'artifact' : ''), text: f.kind }),
      librea.el('p', { style: { margin: '6px 0 0' }, text: f.text })
    ]);
    if (f.mediaPath) item.appendChild(librea.el('img', { class: 'photo', src: '/media/' + f.mediaPath, alt: 'Photo from the portfolio', loading: 'lazy' }));
    item.appendChild(librea.el('p', { class: 'who', text: (f.author && f.author.name ? f.author.name : 'unattributed') + ' · ' + when(f.createdAt) }));
    tl.appendChild(item);
  });
}
</script>
</body>
</html>
